<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5DA9E9"/>
      <stop offset="0.5" stop-color="#3ED0A3"/>
      <stop offset="1" stop-color="#B589E6"/>
    </linearGradient>
    <radialGradient id="bgr" cx="50%" cy="2%" r="80%">
      <stop offset="0" stop-color="#121A28"/>
      <stop offset="60%" stop-color="#0A0E14"/>
      <stop offset="100%" stop-color="#070A10"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="420" fill="url(#bgr)"/>

  <!-- network motif -->
  <g stroke="#5DA9E9" stroke-opacity="0.16" stroke-width="1">
    <line x1="120" y1="70" x2="250" y2="140"/>
    <line x1="250" y1="140" x2="190" y2="260"/>
    <line x1="1050" y1="90" x2="1160" y2="170"/>
    <line x1="1160" y1="170" x2="1080" y2="300"/>
    <line x1="1080" y1="300" x2="980" y2="210"/>
    <line x1="980" y1="210" x2="1160" y2="170"/>
    <line x1="900" y1="340" x2="1080" y2="300"/>
  </g>
  <g fill="#3ED0A3" fill-opacity="0.55">
    <circle cx="120" cy="70" r="3"/><circle cx="250" cy="140" r="3"/><circle cx="190" cy="260" r="3"/>
    <circle cx="1050" cy="90" r="3"/><circle cx="1160" cy="170" r="3"/><circle cx="1080" cy="300" r="3"/>
    <circle cx="980" cy="210" r="3"/><circle cx="900" cy="340" r="3"/>
  </g>

  <!-- availability chip -->
  <g transform="translate(96,96)">
    <rect x="0" y="0" width="330" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <circle cx="20" cy="17" r="4.5" fill="#3ED0A3"/>
    <text x="36" y="22" fill="#9BA8BF" font-size="14" font-family="'JetBrains Mono',monospace">Available for the Jan 2027 research cohort</text>
  </g>

  <!-- name -->
  <text x="92" y="236" fill="url(#g)" font-size="104" font-weight="700" letter-spacing="-3">Joseph Bidias</text>

  <!-- role -->
  <text x="98" y="286" fill="#3ED0A3" font-size="22" font-family="'JetBrains Mono',monospace">Quantitative Researcher &#183; AI Governance Specialist</text>

  <!-- tagline -->
  <text x="98" y="336" fill="#EAEFF7" font-size="22" font-weight="500">I build and study systems where a wrong answer reaches a real person.</text>

  <!-- footer line -->
  <text x="98" y="372" fill="#6B778C" font-size="15">Quantitative risk &#183; Econometrics &#183; AI governance &#183; Rigorous, honest, reproducible</text>
